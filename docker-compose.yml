services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_SUMDB: ${GO_SUMDB:-sum.golang.org}
        GO_PRIVATE: ${GO_PRIVATE:-}
        GO_NO_SUMDB: ${GO_NO_SUMDB:-}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://mirrors.ustc.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://mirrors.ustc.edu.cn/debian-security}
        APT_PACKAGES: ${APT_PACKAGES:-bash ca-certificates curl fonts-dejavu fonts-liberation fonts-noto-cjk libreoffice libreoffice-impress net-tools procps vim wget}
    image: linux-web:latest
    container_name: linux-web
    cpus: ${APP_CPUS:-1.0}
    mem_limit: ${APP_MEMORY:-1536m}
    pids_limit: ${APP_PIDS_LIMIT:-256}
    shm_size: ${APP_SHM_SIZE:-256m}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
    read_only: false
    tmpfs:
      - /tmp
    environment:
      STATIC_DIR: /app/web/dist
      HOME: /data
      GIN_MODE: release
      TMPDIR: /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
